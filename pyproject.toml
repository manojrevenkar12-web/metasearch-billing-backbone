[project]
name = "metasearch-billing-backbone"
version = "1.0.0"
description = "Click-to-invoice data backbone for a travel metasearch"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "numpy>=1.26",
  "pandas>=2.1",
  "sqlglot>=25",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
trino = ["trino>=0.330"]
claude = ["anthropic>=0.40"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "psycopg[binary]>=3.1"]

[project.scripts]
mbb = "mbb.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mbb = ["models/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "B905"]
