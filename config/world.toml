IT = [0.08, "Europe/Rome", 0.90]
NL = [0.08, "Europe/Amsterdam", 1.05]
SE = [0.07, "Europe/Stockholm", 1.00]

[devices]                     # device -> [share, CPC multiplier]
desktop = [0.48, 1.00]
mobile = [0.44, 0.80]
tablet = [0.08, 0.90]

[verticals]                   # base CPC in EUR cents, and which brands carry the vertical (relative weight)
flight = { cpc = 62, brands = { kayak = 1.0, momondo = 1.0, cheapflights = 1.0, hotelscombined = 0.0 } }
hotel = { cpc = 88, brands = { kayak = 0.8, momondo = 0.6, cheapflights = 0.1, hotelscombined = 1.0 } }
car = { cpc = 41, brands = { kayak = 0.3, momondo = 0.2, cheapflights = 0.1, hotelscombined = 0.0 } }

[traffic]
bot_share = 0.05              # automated clicks among all events
bot_crude_share = 0.65        # bots with a datacenter network, a headless agent or an inhuman click speed
monitor_share = 0.004         # the company's own synthetic monitoring clicks
repeat_click_share = 0.04     # people clicking the same offer again shortly after
nat_share = 0.012             # people behind a busy corporate network address
partial_file_share = 0.012    # files that land half-uploaded first
redelivery_share = 0.006      # files a brand delivers a second time under another name

[fx]                          # EUR -> currency, start rate and daily volatility
USD = [1.165, 0.0035]
GBP = [0.862, 0.0022]
SEK = [11.15, 0.0040]
