# Certified metrics: the only numbers the self-service endpoint will answer with.
# Each one names its table, its expression, the dimensions it can be cut by and the words people use for it.

[metrics.billed_clicks]
label = "Billed clicks"
table = "fct_billable_clicks"
expression = "count(*)"
time = "local_date"
unit = "clicks"
words = ["billed clicks", "billable clicks", "paid clicks", "clicks we billed", "clicks billed", "clicks"]
dimensions = { partner = "partner_id", brand = "brand", market = "market", device = "device", day = "local_date", month = "month" }

[metrics.revenue_eur]
label = "Click revenue (EUR)"
table = "mart_daily_revenue"
expression = "round(sum(revenue_eur_minor) / 100.0, 2)"
time = "day"
unit = "EUR"
words = ["revenue", "click revenue", "earned", "income", "money", "eur"]
dimensions = { partner = "partner_id", day = "day" }

[metrics.invalid_share]
label = "Invalid traffic share"
table = "int_clicks_scored"
expression = "round(100.0 * count(invalid_reason) / count(*), 2)"
time = "cast(ts as date)"
unit = "%"
words = ["invalid traffic", "bot share", "bots", "invalid share", "fraud", "invalid clicks"]
dimensions = { partner = "partner_id", brand = "brand", market = "market", device = "device", reason = "invalid_reason", day = "cast(ts as date)" }

[metrics.invoiced_amount]
label = "Invoiced amount (contract currency)"
table = "invoice_register"
expression = "round(sum(amount_minor) / 100.0, 2)"
time = "issued_at"
unit = "contract currency"
words = ["invoiced", "invoice amount", "invoices", "billed amount", "amount billed"]
dimensions = { partner = "partner_id", month = "month", currency = "currency", kind = "kind" }
